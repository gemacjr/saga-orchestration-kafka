# Local environment: Kafka (KRaft) + PostgreSQL + LocalStack (Secrets Manager / SSM) + Kafka UI + the four services.
#   mvn clean package && docker compose up --build
# Infrastructure only (run the services from the IDE with the default "local" profile):
#   docker compose up -d kafka postgres localstack kafka-ui

x-service: &service
  build: &build
    context: .
  restart: unless-stopped
  environment: &env
    SPRING_PROFILES_ACTIVE: local
    AWS_ENDPOINT_URL: http://localstack:4566
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DB_HOST: postgres          # overrides db.host from Parameter Store (which points at localhost for IDE runs)
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared explicitly, like in prod
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4.9
    ports:
      - "4566:4566"
    environment:
      SERVICES: secretsmanager,ssm
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./infra/localstack/seed-aws.sh:/etc/localstack/init/ready.d/seed-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    <<: *service
    build: { <<: *build, args: { MODULE: order-service } }
    ports: ["${ORDER_SERVICE_PORT:-8090}:8090"]

  payment-service:
    <<: *service
    build: { <<: *build, args: { MODULE: payment-service } }
    ports: ["${PAYMENT_SERVICE_PORT:-8091}:8091"]

  inventory-service:
    <<: *service
    build: { <<: *build, args: { MODULE: inventory-service } }
    ports: ["${INVENTORY_SERVICE_PORT:-8092}:8092"]

  saga-orchestrator-service:
    <<: *service
    build: { <<: *build, args: { MODULE: saga-orchestrator-service } }
    ports: ["${ORCHESTRATOR_PORT:-8093}:8093"]

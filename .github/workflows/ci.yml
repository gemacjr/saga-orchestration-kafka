name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # Unit, contract, Testcontainers (Postgres, Kafka) and LocalStack tests; JaCoCo fails the build below the gate
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo "| Module | Lines | Branches |"
            echo "|---|---|---|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v m="${csv%%/*}" 'NR>1{lm+=$8;lc+=$9;bm+=$6;bc+=$7}
                END{printf "| %s | %.1f%% | %.1f%% |\n", m, 100*lc/(lm+lc), (bm+bc)?100*bc/(bm+bc):100}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # Tests already run in the verify job; this job checks the packaged images against the full stack
      - name: Package services
        run: mvn -B -ntp package -DskipTests -Djacoco.skip=true

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run saga scenarios
        run: ./scripts/e2e.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
